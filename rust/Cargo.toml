# Block Survivors en Rust (migration : docs/PLAN-RUST.md). Les versions des dépendances
# partagées sont épinglées ici une seule fois ; chaque crate n'ajoute que ses fonctionnalités.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bs-commun = { path = "crates/bs-commun" }
bs-donnees = { path = "crates/bs-donnees" }
bs-monde = { path = "crates/bs-monde" }
block-survivors = { path = "crates/block-survivors" }
bs-regles = { path = "crates/bs-regles" }
bs-sauvegarde = { path = "crates/bs-sauvegarde" }
bs-protocole = { path = "crates/bs-protocole" }
bs-relais = { path = "crates/bs-relais" }
bs-reseau = { path = "crates/bs-reseau" }
bs-maj = { path = "crates/bs-maj" }
bs-rendu = { path = "crates/bs-rendu" }
bs-audio = { path = "crates/bs-audio" }
bs-robot = { path = "crates/bs-robot" }
libm = "0.2"
# Fonctionnalités de Bevy listées une à une : pas d'audio de Bevy (le son passera par kira).
# Liste de `default_platform` recopiée sans « webgl2 » ni Android (jeu PC seulement).
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
    "sysinfo_plugin",
    "3d_bevy_render",
    "2d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "png",
    "https",
] }

[workspace.lints.rust]
# « deny » (pas « forbid ») : seul le test d’allocation de bs-regles le lève, localement
unsafe_code = "deny"

[workspace.lints.clippy]
# Les paramètres d'un système Bevy sont ses dépendances : longues listes normales
too_many_arguments = "allow"
type_complexity = "allow"

# En développement, les dépendances optimisées (Bevy est inutilisable en opt-level 0)
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Version publiée : optimisations maximales
[profile.ship]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
# Sans les symboles : 49 Mo au lieu de 71 sous Linux (docs/PROTOTYPE-RUST.md, pari 4)
strip = true
