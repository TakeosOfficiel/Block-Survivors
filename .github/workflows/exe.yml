# Construit l'application Windows (BlockSurvivors.exe, portable) à chaque push
# et la publie deux fois :
#   - release « vX.Y.Z » (version de package.json), notes tirées de CHANGELOG.md ;
#     tant que le numéro ne change pas, elle suit le dernier commit de la version ;
#   - release « derniere-version » : lien fixe vers la plus récente.
name: Application Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exe
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Sous Windows, l'icône et les métadonnées peuvent être écrites dans l'exe
      - run: npx electron-builder --win portable --publish never --config.win.signAndEditExecutable=true
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: BlockSurvivors
          path: release/BlockSurvivors.exe
      - name: Publier la release de la version et « derniere-version »
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Section « ## [X.Y.Z] » du CHANGELOG, jusqu'à la version suivante
          awk -v v="$VERSION" '
            /^## \[/ { dedans = index($0, "[" v "]") > 0; next }
            dedans { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $VERSION." > notes.md
          printf '\n---\nConstruit depuis %s (%s).\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" >> notes.md
          cp release/BlockSurvivors.exe "release/BlockSurvivors-v$VERSION.exe"

          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" "release/BlockSurvivors-v$VERSION.exe" \
            --target "$GITHUB_SHA" \
            --title "Block Survivors $VERSION" \
            --notes-file notes.md \
            --latest

          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version release/BlockSurvivors.exe \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Block Survivors — dernière version ($VERSION)" \
            --notes-file notes.md
      # Fichier de version public (dépôt TakeosOfficiel/Block-Survivors-version, qui ne
      # contient que ce fichier) : le jeu y lit le numéro de la dernière version pour
      # prévenir les joueurs. Sans le secret VERSION_TOKEN, l'étape ne fait rien.
      - name: Publier le numéro de version
        shell: bash
        env:
          VERSION_TOKEN: ${{ secrets.VERSION_TOKEN }}
        run: |
          if [ -z "$VERSION_TOKEN" ]; then echo "Secret VERSION_TOKEN absent : fichier de version non publié."; exit 0; fi
          VERSION=$(node -p "require('./package.json').version")
          API=https://api.github.com/repos/TakeosOfficiel/Block-Survivors-version/contents/version.json
          printf '{\n  "version": "%s",\n  "telechargement": "https://github.com/TakeosOfficiel/Block-Survivors/releases/latest"\n}\n' "$VERSION" > version.json
          SHA=$(curl -s -H "Authorization: Bearer $VERSION_TOKEN" "$API" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).sha||'')}catch{console.log('')}})")
          node -e "const fs=require('fs');const corps={message:'Version '+process.argv[1],content:fs.readFileSync('version.json').toString('base64')};if(process.argv[2])corps.sha=process.argv[2];fs.writeFileSync('corps.json',JSON.stringify(corps))" "$VERSION" "$SHA"
          curl -sf -X PUT -H "Authorization: Bearer $VERSION_TOKEN" -H "Accept: application/vnd.github+json" "$API" --data @corps.json > /dev/null
          echo "version.json → $VERSION"
