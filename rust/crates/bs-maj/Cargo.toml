[package]
name = "bs-maj"
description = "Mises à jour du jeu sur PC : manifeste signé (ed25519) devant Velopack"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# public-utils : rend public `bundle::Manifest`, dans la signature de `UpdateSource`
velopack = { version = "=1.2.161", features = ["public-utils"] }
ed25519-dalek = "2.2"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
semver = "1"

[lints]
workspace = true

[dev-dependencies]
ed25519-dalek = "2.2"
