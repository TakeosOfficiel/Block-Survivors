# Construit l'application Windows (BlockSurvivors.exe, portable) à chaque push
# et la publie deux fois :
#   - release « vX.Y.Z » (version de package.json), notes tirées de CHANGELOG.md ;
#     tant que le numéro ne change pas, elle suit le dernier commit de la version ;
#   - release « derniere-version » : lien fixe vers la plus récente.
name: Application Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exe
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : tags des anciennes versions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Sous Windows, l'icône et les métadonnées peuvent être écrites dans l'exe
      - run: npx electron-builder --win portable --publish never --config.win.signAndEditExecutable=true
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: BlockSurvivors
          path: release/BlockSurvivors.exe
      # Anciennes versions (avant le suivi) : une release avec ses notes, sans exe.
      # Créées par l'API des releases (un « git push » de tag est refusé ici).
      - name: Releases des versions publiées avant le suivi des versions
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r version commit; do
            gh release view "v$version" >/dev/null 2>&1 && continue
            awk -v v="$version" '
              /^## \[/ { dedans = index($0, "[" v "]") > 0; next }
              dedans { print }
            ' CHANGELOG.md > notes-ancienne.md
            gh release create "v$version" --target "$commit" --title "Block Survivors $version" \
              --notes-file notes-ancienne.md --latest=false || echo "v$version : non créée"
          done <<'FIN'
          0.2.0 749af87972ec65828c6c7fa42e511d4c0e2b91a8
          0.3.0 4e06a10c64ff42686d195b947fa7be0362d10435
          0.4.0 b499706d294ea7dae873ccb503f2d35add57b513
          0.5.0 77a02def97fe433de3e18c842f4d44b34baaa6ca
          FIN
      - name: Publier la release de la version et « derniere-version »
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Section « ## [X.Y.Z] » du CHANGELOG, jusqu'à la version suivante
          awk -v v="$VERSION" '
            /^## \[/ { dedans = index($0, "[" v "]") > 0; next }
            dedans { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $VERSION." > notes.md
          printf '\n---\nConstruit depuis %s (%s).\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" >> notes.md
          cp release/BlockSurvivors.exe "release/BlockSurvivors-v$VERSION.exe"

          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" "release/BlockSurvivors-v$VERSION.exe" \
            --target "$GITHUB_SHA" \
            --title "Block Survivors $VERSION" \
            --notes-file notes.md \
            --latest

          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version release/BlockSurvivors.exe \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Block Survivors — dernière version ($VERSION)" \
            --notes-file notes.md
