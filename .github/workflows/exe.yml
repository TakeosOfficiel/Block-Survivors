# Construit l'installateur Windows (BlockSurvivors-Setup-X.Y.Z.exe) et l'AppImage
# Linux (BlockSurvivors-X.Y.Z.AppImage) à chaque push. Seul main publie (les autres
# branches gardent les installateurs en artefacts, pour essai), deux fois :
#   - release « vX.Y.Z » (version de package.json), notes tirées de CHANGELOG.md ;
#     tant que le numéro ne change pas, elle suit le dernier commit de la version ;
#   - release « derniere-version » : lien fixe vers la plus récente.
name: Application Windows et Linux

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# Une construction à la fois par branche : une branche de travail n'annule pas celle de main
concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Sous Windows, l'icône et les métadonnées peuvent être écrites dans l'exe
      # latest.yml et le .blockmap servent aux mises à jour automatiques du jeu installé.
      # socle.json : empreinte de tout ce qui n'est pas la page du jeu ; tant
      # qu'elle ne change pas, le jeu installé ne télécharge que la page (jeu.json)
      - run: node scripts/socle.mjs --ecrire
      - run: npx electron-builder --win nsis --publish never --config.win.signAndEditExecutable=true
        shell: bash
      - run: node scripts/socle.mjs --page release
      - uses: actions/upload-artifact@v4
        with:
          name: BlockSurvivors-windows
          path: |
            release/BlockSurvivors-Setup-*.exe
            release/BlockSurvivors-Setup-*.exe.blockmap
            release/latest.yml
            release/jeu-*.html
            release/jeu.json

  # Même socle que sous Windows (fins de ligne normalisées) : la page du jeu et
  # jeu.json publiés par le job Windows valent aussi pour l'AppImage.
  # latest-linux.yml sert aux mises à jour automatiques de l'AppImage.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/socle.mjs --ecrire
      - run: npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BlockSurvivors-linux
          path: |
            release/BlockSurvivors-*.AppImage
            release/latest-linux.yml

  publier:
    if: github.ref == 'refs/heads/main'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publier la release de la version et « derniere-version »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Section « ## [X.Y.Z] » du CHANGELOG, jusqu'à la version suivante
          awk -v v="$VERSION" '
            /^## \[/ { dedans = index($0, "[" v "]") > 0; next }
            dedans { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $VERSION." > notes.md
          printf '\n---\nConstruit depuis %s (%s).\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" >> notes.md
          INSTALLATEURS=("release/BlockSurvivors-Setup-$VERSION.exe" "release/BlockSurvivors-$VERSION.AppImage")

          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" "${INSTALLATEURS[@]}" \
            --target "$GITHUB_SHA" \
            --title "Block Survivors $VERSION" \
            --notes-file notes.md \
            --latest

          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version "${INSTALLATEURS[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Block Survivors — dernière version ($VERSION)" \
            --notes-file notes.md
      # Dépôt public TakeosOfficiel/Block-Survivors-version : le code reste privé, mais
      # les joueurs doivent pouvoir télécharger le jeu. On y publie donc la release
      # « vX.Y.Z » avec l'installateur Windows, son .blockmap et latest.yml, l'AppImage
      # Linux et latest-linux.yml, plus la page du jeu seule et jeu.json : le jeu
      # installé lit jeu.json de la dernière release et ne télécharge que la page quand
      # Electron n'a pas changé, sinon latest.yml (latest-linux.yml sous Linux) et
      # l'installateur complet.
      # Puis version.json, que lisent les anciens exe portables et la version
      # navigateur (l'installateur d'abord : on n'annonce pas une version qu'on ne
      # peut pas encore télécharger).
      # Sans le secret VERSION_TOKEN, l'étape ne fait rien.
      - name: Publier les installateurs et le numéro de version sur le dépôt public
        env:
          VERSION_TOKEN: ${{ secrets.VERSION_TOKEN }}
        run: |
          if [ -z "$VERSION_TOKEN" ]; then echo "Secret VERSION_TOKEN absent : rien de publié sur le dépôt public."; exit 0; fi
          VERSION=$(node -p "require('./package.json').version")
          DEPOT=TakeosOfficiel/Block-Survivors-version

          # Notes sans la ligne « Construit depuis <branche> (<commit>) » du dépôt privé
          awk '/^---$/ { exit } { print }' notes.md > notes-publiques.md
          [ -s notes-publiques.md ] || echo "Version $VERSION." > notes-publiques.md
          GH_TOKEN="$VERSION_TOKEN" gh release delete "v$VERSION" --repo "$DEPOT" --yes --cleanup-tag || true
          GH_TOKEN="$VERSION_TOKEN" gh release create "v$VERSION" \
            "release/BlockSurvivors-Setup-$VERSION.exe" \
            "release/BlockSurvivors-Setup-$VERSION.exe.blockmap" \
            release/latest.yml \
            "release/BlockSurvivors-$VERSION.AppImage" \
            release/latest-linux.yml \
            "release/jeu-$VERSION.html" \
            release/jeu.json \
            --repo "$DEPOT" \
            --title "Block Survivors $VERSION" \
            --notes-file notes-publiques.md \
            --latest

          API=https://api.github.com/repos/$DEPOT/contents/version.json
          printf '{\n  "version": "%s",\n  "telechargement": "https://github.com/%s/releases/latest"\n}\n' "$VERSION" "$DEPOT" > version.json
          SHA=$(curl -s -H "Authorization: Bearer $VERSION_TOKEN" "$API" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).sha||'')}catch{console.log('')}})")
          node -e "const fs=require('fs');const corps={message:'Version '+process.argv[1],content:fs.readFileSync('version.json').toString('base64')};if(process.argv[2])corps.sha=process.argv[2];fs.writeFileSync('corps.json',JSON.stringify(corps))" "$VERSION" "$SHA"
          curl -sf -X PUT -H "Authorization: Bearer $VERSION_TOKEN" -H "Accept: application/vnd.github+json" "$API" --data @corps.json > /dev/null
          echo "version.json → $VERSION"
